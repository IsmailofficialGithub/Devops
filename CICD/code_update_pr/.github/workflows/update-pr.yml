name: Code Update PR

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump patch version
        id: bump
        working-directory: app
        run: |
          old=$(tr -d '[:space:]' < VERSION)
          IFS=. read -r major minor patch <<<"$old"
          patch=$((patch+1))
          new="${major}.${minor}.${patch}"
          echo "$new" > VERSION
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump version to ${{ steps.bump.outputs.new }}"
          title: "chore: bump version ${{ steps.bump.outputs.old }} → ${{ steps.bump.outputs.new }}"
          body: |
            Automated version bump from GitHub Actions.
          branch: chore/bump-version-${{ steps.bump.outputs.new }}
          delete-branch: true
