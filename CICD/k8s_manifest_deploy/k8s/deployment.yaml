apiVersion: apps/v1
kind: Deployment
metadata:
  name: manifest-demo
  labels:
    app: manifest-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: manifest-demo
  template:
    metadata:
      labels:
        app: manifest-demo
    spec:
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: manifest-demo
spec:
  selector:
    app: manifest-demo
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
