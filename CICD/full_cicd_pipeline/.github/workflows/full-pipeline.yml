name: Full CI CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: cicd-full-pipeline

jobs:
  test-and-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test and build
        working-directory: app
        run: |
          npm test
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: full-pipeline-dist
          path: app/dist/

  docker:
    needs: test-and-artifact
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        run: |
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

  deploy-k8s:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
      - name: Deploy
        run: |
          IMAGE="${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag }}"
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|g" k8s/app.yaml > /tmp/app.yaml
          kubectl apply -f /tmp/app.yaml
          kubectl rollout status deployment/full-pipeline --timeout=120s

  update-code:
    needs: [docker, deploy-k8s]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update deployed image pointer in repo
        run: |
          cat > config/deployed-image.env <<EOF
          image=${{ needs.docker.outputs.image }}
          tag=${{ needs.docker.outputs.tag }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/deployed-image.env
          git diff --staged --quiet || git commit -m "ci: update deployed image to ${{ needs.docker.outputs.tag }}"
          git push
