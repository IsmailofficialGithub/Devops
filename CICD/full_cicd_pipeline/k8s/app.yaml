apiVersion: apps/v1
kind: Deployment
metadata:
  name: full-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: full-pipeline
  template:
    metadata:
      labels:
        app: full-pipeline
    spec:
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: full-pipeline
spec:
  type: ClusterIP
  selector:
    app: full-pipeline
  ports:
    - port: 80
      targetPort: 80
