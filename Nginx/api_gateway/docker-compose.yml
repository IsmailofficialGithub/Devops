services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT}:80"
    env_file: .env
    volumes:
      - ./templates:/etc/nginx/templates:ro
    depends_on:
      - users-api
      - orders-api
      - auth-api
    restart: unless-stopped

  users-api:
    image: hashicorp/http-echo:1.0
    command: ["-text=users-api", "-listen=:4001"]
    expose: ["4001"]

  orders-api:
    image: hashicorp/http-echo:1.0
    command: ["-text=orders-api", "-listen=:4002"]
    expose: ["4002"]

  auth-api:
    image: hashicorp/http-echo:1.0
    command: ["-text=auth-api", "-listen=:4003"]
    expose: ["4003"]
