services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT}:80"
    env_file: .env
    volumes:
      - ./templates:/etc/nginx/templates:ro
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - stream-app
    restart: unless-stopped

  stream-app:
    image: hashicorp/http-echo:1.0
    command: ["-text=streaming-backend", "-listen=:8080"]
    expose: ["8080"]
