<VirtualHost *:443>
    ServerName shop.local
    ServerAlias www.shop.local
    DocumentRoot /var/www/shop

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/shop.crt
    SSLCertificateKeyFile /etc/ssl/private/shop.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLCompression off
    SSLSessionTickets off

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self)"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
    Header always unset X-Powered-By
    Header unset Server

    <Location "/">
        <LimitExcept GET HEAD POST OPTIONS>
            Require all denied
        </LimitExcept>
    </Location>

    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} ^(TRACE|TRACK)$ [NC]
    RewriteRule .* - [F,L]

    <Directory /var/www/shop>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        <LimitExcept GET HEAD POST OPTIONS>
            Require all denied
        </LimitExcept>
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /api/ http://shop-app:6000/api/
    ProxyPassReverse /api/ http://shop-app:6000/api/
    ProxyPass        /checkout/ http://shop-app:6000/checkout/
    ProxyPassReverse /checkout/ http://shop-app:6000/checkout/

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/shop-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/shop-ssl-access.log combined
</VirtualHost>
