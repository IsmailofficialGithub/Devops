# Shared security / header defaults (optional include)
# Include this from apache2.conf or conf-enabled:
#   Include /path/to/apache_proxy/conf/security-headers.conf

ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Only allow these methods globally (extra safety net)
<Directory />
    <LimitExcept GET HEAD POST OPTIONS>
        Require all denied
    </LimitExcept>
</Directory>
