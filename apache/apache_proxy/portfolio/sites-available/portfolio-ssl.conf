<VirtualHost *:443>
    ServerName portfolio.local
    ServerAlias www.portfolio.local

    DocumentRoot /var/www/portfolio

    # --- SSL ---
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/portfolio.crt
    SSLCertificateKeyFile /etc/ssl/private/portfolio.key
    # SSLCertificateChainFile /etc/ssl/certs/portfolio-chain.crt

    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder     off
    SSLCompression          off
    SSLSessionTickets       off

    # HSTS (force browsers to use HTTPS)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

    # --- Security headers ---
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
    Header always unset X-Powered-By
    Header unset Server

    # --- Allowed request methods ---
    # Deny everything except GET, HEAD, POST, OPTIONS
    <Location "/">
        <LimitExcept GET HEAD POST OPTIONS>
            Require all denied
        </LimitExcept>
    </Location>

    # Block TRACE / TRACK
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} ^(TRACE|TRACK)$ [NC]
    RewriteRule .* - [F,L]

    # --- Document root ---
    <Directory /var/www/portfolio>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Same method limits at directory level
        <LimitExcept GET HEAD POST OPTIONS>
            Require all denied
        </LimitExcept>
    </Directory>

    # --- Reverse proxy (uncomment for API backend) ---
    # ProxyPreserveHost On
    # ProxyRequests Off
    # RequestHeader set X-Forwarded-Proto "https"
    # RequestHeader set X-Forwarded-Port "443"
    # ProxyPass        /api/ http://app:3000/
    # ProxyPassReverse /api/ http://app:3000/

    # --- Compression ---
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/portfolio-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/portfolio-ssl-access.log combined
</VirtualHost>
