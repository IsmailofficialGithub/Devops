<VirtualHost *:443>
    ServerName api.local
    ServerAlias www.api.local
    DocumentRoot /var/www/api

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/api.crt
    SSLCertificateKeyFile /etc/ssl/private/api.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLCompression off
    SSLSessionTickets off

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'"
    Header always set Access-Control-Allow-Origin "https://portfolio.local"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With"
    Header always set Access-Control-Max-Age "86400"
    Header always unset X-Powered-By
    Header unset Server

    # REST methods allowed
    <Location "/">
        <LimitExcept GET HEAD POST PUT PATCH DELETE OPTIONS>
            Require all denied
        </LimitExcept>
    </Location>

    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} ^(TRACE|TRACK)$ [NC]
    RewriteRule .* - [F,L]

    # CORS preflight
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteRule ^(.*)$ $1 [R=204,L]

    <Directory /var/www/api>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        <LimitExcept GET HEAD POST PUT PATCH DELETE OPTIONS>
            Require all denied
        </LimitExcept>
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass        / http://api-app:4000/
    ProxyPassReverse / http://api-app:4000/

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/json text/plain
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/api-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/api-ssl-access.log combined
</VirtualHost>
