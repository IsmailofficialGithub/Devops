<VirtualHost *:443>
    ServerName streaming.local
    ServerAlias www.streaming.local

    DocumentRoot /var/www/streaming

    # --- SSL ---
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/streaming.crt
    SSLCertificateKeyFile /etc/ssl/private/streaming.key

    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder     off
    SSLCompression          off
    SSLSessionTickets       off

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    # CSP allows websocket + media streams
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' wss: https:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
    Header always unset X-Powered-By
    Header unset Server

    # Allowed methods (GET for streams, POST for auth/signals)
    <Location "/">
        <LimitExcept GET HEAD POST OPTIONS>
            Require all denied
        </LimitExcept>
    </Location>

    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} ^(TRACE|TRACK)$ [NC]
    RewriteRule .* - [F,L]

    <Directory /var/www/streaming>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        <LimitExcept GET HEAD POST OPTIONS>
            Require all denied
        </LimitExcept>
    </Directory>

    # --- Reverse proxy: HTTP app + WebSockets ---
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # WebSocket upgrade → streaming backend (ws)
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/ws/(.*)       ws://streaming-app:8080/ws/$1 [P,L]
    RewriteRule ^/socket\.io/(.*) ws://streaming-app:8080/socket.io/$1 [P,L]

    # Explicit WebSocket proxy (mod_proxy_wstunnel)
    ProxyPass        /ws/        ws://streaming-app:8080/ws/
    ProxyPassReverse /ws/        ws://streaming-app:8080/ws/
    ProxyPass        /socket.io/ ws://streaming-app:8080/socket.io/
    ProxyPassReverse /socket.io/ ws://streaming-app:8080/socket.io/

    # HLS / DASH media + REST API
    ProxyPass        /stream/    http://streaming-app:8080/stream/
    ProxyPassReverse /stream/    http://streaming-app:8080/stream/
    ProxyPass        /api/       http://streaming-app:8080/api/
    ProxyPassReverse /api/       http://streaming-app:8080/api/

    # Long-lived connections for streaming
    ProxyTimeout 3600
    ProxyBadHeader Ignore

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json
        # Do not compress media segments
        SetEnvIfNoCase Request_URI \.(m3u8|ts|mpd|m4s)$ no-gzip
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/streaming-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/streaming-ssl-access.log combined
</VirtualHost>
