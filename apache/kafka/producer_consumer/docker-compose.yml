services:
  kafka:
    image: ${KAFKA_IMAGE}
    hostname: kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: ${CLUSTER_ID}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [pc-net]

  topic-init:
    image: ${KAFKA_IMAGE}
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic ${TOPIC_NAME} --partitions 3 --replication-factor 1
    networks: [pc-net]
    restart: "no"

  producer:
    image: ${KCAT_IMAGE}
    depends_on:
      topic-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=1
        while [ $$i -le ${MESSAGE_COUNT} ]; do
          echo "order-$$i|{\"id\":$$i,\"status\":\"created\"}"
          i=$$((i+1))
        done | kcat -P -b ${BOOTSTRAP_SERVER} -t ${TOPIC_NAME} -K "|"
        echo "produced ${MESSAGE_COUNT} messages to ${TOPIC_NAME}"
    networks: [pc-net]
    profiles: ["tools"]

  consumer:
    image: ${KCAT_IMAGE}
    depends_on:
      topic-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        kcat -C -b ${BOOTSTRAP_SERVER} -t ${TOPIC_NAME} -o beginning -e -q
    networks: [pc-net]
    profiles: ["tools"]

networks:
  pc-net:
